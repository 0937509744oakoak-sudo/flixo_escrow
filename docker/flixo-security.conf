# FLIXO Escrow — server-level hardening for the php:8.2-apache image.
#
# Debian's stock apache2.conf sets "AllowOverride None" for /var/www/, which
# silently disables every .htaccess in this repo. We enable overrides here AND
# restate the critical denials at server level, so protection does not depend
# on a single directive staying correct.

ServerTokens Prod
ServerSignature Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Dotfiles — most importantly .env and .git/
<DirectoryMatch "^/var/www/html/.*/\.">
    Require all denied
</DirectoryMatch>

<FilesMatch "^\.">
    Require all denied
</FilesMatch>

# Source, config and research artifacts that must never be served.
<FilesMatch "(?i)\.(sql|md|log|ini|yml|yaml|sh|py|pyc|docx|pptx|xml|lock|dist|bak|old|sample|example)$">
    Require all denied
</FilesMatch>

<FilesMatch "(?i)^(composer\.json|Dockerfile|Procfile)$">
    Require all denied
</FilesMatch>

# Directories that hold code, secrets or private user data. Files under
# uploads/ that users are allowed to see are served by authorising controllers.
<DirectoryMatch "^/var/www/html/(includes|models|migrations|scripts|tests|docs|PHPMailer|logs|storage|data_real)(/|$)">
    Require all denied
</DirectoryMatch>

<DirectoryMatch "^/var/www/html/uploads/(sessions|kyc|slips|withdrawal_slips|disputes)(/|$)">
    Require all denied
</DirectoryMatch>

# Uploads are user-controlled bytes: serve them, never execute or render them.
<Directory /var/www/html/uploads>
    Options -Indexes -ExecCGI
    php_admin_flag engine off
    RemoveHandler .php .phtml .phar
    RemoveType .php .phtml .phar

    <FilesMatch "(?i)\.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|htm|html|svg)$">
        Require all denied
    </FilesMatch>
</Directory>
